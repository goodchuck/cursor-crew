<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:28px 36px;font:15px system-ui,"Malgun Gothic",sans-serif;background:#f4f4f5;color:#18181b;width:1100px;box-sizing:border-box}
h1{font-size:22px;margin:0 0 4px} .sub{color:#71717a;margin:0 0 18px}
.row{display:grid;grid-template-columns:200px 150px 150px 1fr;align-items:center;gap:18px;background:#fff;border-radius:16px;padding:16px 20px;margin-bottom:14px}
.row b{font-size:17px} .row p{margin:4px 0 0;color:#71717a;font-size:13px;line-height:1.5}
.pane{border-radius:12px;display:flex;align-items:center;justify-content:center;height:150px}
.light{background:#fafafa;border:1px solid #e4e4e7}.dark{background:#202124}
.bars{display:grid;gap:8px}
.bar{display:flex;align-items:center;gap:14px;border-radius:8px;padding:8px 12px;font-size:12px}
.bar.l{background:#e8eaed;color:#3c4043}.bar.d{background:#35363a;color:#bdc1c6}
canvas{image-rendering:pixelated}
</style></head><body>
<h1>Cursor Crew 아이콘 시안</h1>
<p class="sub">왼쪽: 스토어·확장 관리 화면(128px) 밝은/어두운 배경 · 오른쪽: 실제 툴바 크기(16·32px)와 48px</p>
<div id="rows"></div>
<script>
const N = 16;
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); const t = f < 0 ? 0 : 255, p = Math.abs(f);
  return "rgb(" + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.round(v + (t - v) * p)).join(",") + ")"; };
const blank = () => Array.from({ length: N }, () => Array(N).fill(null));

// 반타원 돔 슬라임(확장 안의 펫과 같은 방식)
function slime(g, cx, base, rx, ry, color, face = true) {
  const pal = { o: shade(color, -0.62), c: color, d: shade(color, -0.18), l: shade(color, 0.7) };
  const inside = (x, y) => { if (y > base) return false; const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - (base + 1)) / ry; return dx * dx + dy * dy <= 1; };
  let top = N;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!inside(x, y)) continue; top = Math.min(top, y);
    const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
    g[y][x] = edge ? pal.o : y === base - 1 ? pal.d : pal.c;
  }
  const set = (x, y, c) => { if (g[y] && g[y][x] && g[y][x] !== pal.o) g[y][x] = c; };
  const hx = Math.round(cx - rx * 0.5);
  set(hx, top + 2, pal.l); set(hx + 1, top + 2, pal.l); set(hx, top + 3, pal.l);
  if (face) {
    const ey = Math.round(base + 1 - ry * 0.48);
    const gap = rx > 5 ? 2 : 1;
    for (const ex of [Math.round(cx - gap - 0.5), Math.round(cx + gap - 0.5)]) { set(ex, ey, "#1d1b24"); if (ry > 7) set(ex, ey + 1, "#1d1b24"); }
    if (rx > 5) { set(Math.round(cx - 4), ey + 2, "#ff9db5"); set(Math.round(cx + 3), ey + 2, "#ff9db5"); }
  }
}
function paint(g, rows, ox, oy, pal) {
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) g[oy + y][ox + x] = pal[ch]; }));
}
const ARROW = ["o......", "oo.....", "owo....", "owwo...", "owwwo..", "owwwwo.", "owwwwwo", "owwoooo", "owo....", "oo.....", "o......"];

const concepts = [
  { name: "A. 슬라임 한 마리", note: "가장 단순. 펫 그 자체라 설치 후 화면과 바로 연결돼요. 16px에서도 또렷해요.", tile: "#dff5e3",
    draw(g) { slime(g, 8, 14, 7, 12, "#5BD16A"); } },
  { name: "B. 슬라임 셋 (Crew)", note: "이름의 'Crew'와 3마리 기능을 그대로 보여 줘요. 16px에서는 얼굴이 작아져요.", tile: "#e3effa",
    draw(g) { slime(g, 3.5, 14, 3.6, 7, "#5AB8F0", true); slime(g, 12.5, 14, 3.6, 7, "#F2766B", true); slime(g, 8, 15, 5.2, 10, "#5BD16A"); } },
  { name: "C. 커서 + 따라오는 슬라임", note: "'마우스를 따라다닌다'가 한눈에 보여요. 스토어에서 뭘 하는 확장인지 가장 잘 전달돼요.", tile: "#fdf0dc",
    draw(g) { paint(g, ARROW, 1, 0, { o: "#1d1b24", w: "#ffffff" }); slime(g, 10.5, 15, 5.2, 9, "#5BD16A"); } },
  { name: "D. 키캡 속 슬라임", note: "'키 누르고 클릭하는 단축 버튼' 느낌. 생산성 도구 쪽으로 포지셔닝할 때 어울려요.", tile: "#ede7fb",
    draw(g) {
      const k = "#3f3a52", f = "#ffffff", s = "#d6d1e6";
      for (let y = 1; y <= 15; y++) for (let x = 0; x < 16; x++) {
        const edge = y === 1 || y === 15 || x === 0 || x === 15; const corner = (x === 0 || x === 15) && (y === 1 || y === 15);
        if (corner) continue; g[y][x] = edge ? k : y >= 13 ? s : f;
      }
      slime(g, 8, 12, 5.6, 9, "#B48CF2");
    } },
];

function canvasFor(grid, size, tile, pad) {
  const cv = document.createElement("canvas"); cv.width = cv.height = size; const c = cv.getContext("2d");
  if (tile) { const r = size * 0.22; c.fillStyle = tile; c.beginPath(); c.roundRect(0, 0, size, size, r); c.fill(); }
  const sc = (size - pad * 2) / N;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (grid[y][x]) { c.fillStyle = grid[y][x]; c.fillRect(pad + x * sc, pad + y * sc, Math.ceil(sc), Math.ceil(sc)); }
  return cv;
}
const rows = document.getElementById("rows");
for (const k of concepts) {
  const g = blank(); k.draw(g);
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<div><b>${k.name}</b><p>${k.note}</p></div><div class="pane light"></div><div class="pane dark"></div><div class="bars"><div class="bar l"></div><div class="bar d"></div></div>`;
  const [l, d] = row.querySelectorAll(".pane");
  l.append(canvasFor(g, 128, k.tile, 16)); d.append(canvasFor(g, 128, k.tile, 16));
  for (const bar of row.querySelectorAll(".bar")) {
    bar.append(canvasFor(g, 16, null, 0), "16px", canvasFor(g, 32, null, 0), "32px", canvasFor(g, 48, k.tile, 8), "48px");
  }
  rows.append(row);
}
</script></body></html>
