<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Cursor Crew 테스트 페이지</title>
<style>
  body { font: 16px/1.6 system-ui, "Malgun Gothic", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #222; background: #fff; }
  .box { height: 600px; background: linear-gradient(#f4f1ff, #e9fbf5); border-radius: 16px; padding: 24px; margin: 24px 0; }
  input { font: inherit; padding: 8px 10px; width: 100%; box-sizing: border-box; }
  button { font: inherit; padding: 8px 14px; }
</style>
</head>
<body>
  <h1>Cursor Crew 테스트 페이지</h1>
  <p>확장 없이 콘텐츠 스크립트를 돌려 보는 페이지입니다(<code>pnpm harness</code>). chrome.* 는 <code>chrome-shim.ts</code>가 흉내 내요. 마우스를 움직이고, Alt를 누른 채 펫을 클릭해 보세요(평소엔 클릭이 펫을 통과해요).</p>
  <p><button id="pageBtn" onclick="this.textContent = '페이지 버튼 클릭됨 ' + (++window.n || (window.n = 1))">페이지 버튼</button></p>
  <p><input placeholder="여기에 타이핑하면 펫이 흐려져요" /></p>
  <div class="box">긴 영역 (스크롤 테스트)</div>
  <div class="box">더 긴 영역</div>
  <script type="module" src="./harness.ts"></script>
</body>
</html>
